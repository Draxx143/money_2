name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python3 -m unittest discover -s tests -v
      - name: Compile application and tests
        run: python3 -m compileall -q src tests && python3 -m py_compile src/pcb-analyzer

  debian-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Debian package tools
        run: sudo apt-get update && sudo apt-get install -y dpkg-dev
      - name: Build Debian package
        run: sh scripts/build-deb.sh
      - name: Validate package metadata and file list
        run: |
          dpkg-deb --info "dist/pcb-analyzer_$(cat VERSION)_all.deb"
          dpkg-deb --contents "dist/pcb-analyzer_$(cat VERSION)_all.deb"
      - uses: actions/upload-artifact@v4
        with:
          name: pcb-analyzer-deb
          path: dist/*.deb
          if-no-files-found: error
