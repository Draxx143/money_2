[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pcb-analyzer"
dynamic = ["version"]
description = "GTK 3 PCB inspection, test-point management, and diagnostics"
requires-python = ">=3.8"
license = { file = "LICENSE" }

[tool.setuptools.dynamic]
version = {file = "VERSION"}

[tool.setuptools]
package-dir = {"" = "src"}

[project.optional-dependencies]
altium = ["altium-monkey"]

[tool.ruff]
line-length = 100
target-version = "py38"
